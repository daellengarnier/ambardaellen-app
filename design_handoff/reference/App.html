<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --cream:      #EFE6D3;
    --cream-deep: #E4D9BF;
    --paper:      #FBF6E8;
    --paper-2:    #F5EEDB;
    --ink:        #211913;
    --ink-soft:   #4F4338;
    --muted:      #978675;
    --terra:      #C5634B;
    --terra-deep: #A14934;
    --terra-soft: #ECC4B0;
    --sage:       #7E977B;
    --sage-soft:  #CBD8C2;
    --plum:       #4B3050;
    --plum-soft:  #C7B0CB;
    --gold:       #C8973F;
    --gold-soft:  #E8D29A;
    --rose:       #C77F77;
    --line:       #DAC9A8;
  }
  html, body { background: #D9CCAE; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.005em;
  }
  .serif { font-family: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif; font-style: normal; letter-spacing: -0.012em; }
  .serif-i { font-family: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif; font-style: italic; letter-spacing: -0.012em; }
  .mono { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  .uplabel { text-transform: uppercase; letter-spacing: 0.18em; font-weight: 600; }
  /* Hide scrollbars inside the phone */
  .phone-scroll::-webkit-scrollbar { display: none; }
  .phone-scroll { scrollbar-width: none; }

  /* Bottom sheet animation */
  @keyframes sheetIn {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  .sheet-enter { animation: sheetIn 320ms cubic-bezier(.22,1,.36,1); }
  .scrim-enter { animation: fadeIn 240ms ease-out; }

  /* Tap feedback */
  .tap { transition: transform .12s ease, background .12s ease; }
  .tap:active { transform: scale(0.97); }

  /* Checkbox tick draw */
  @keyframes tickIn {
    from { stroke-dashoffset: 16; }
    to   { stroke-dashoffset: 0; }
  }
  .tick-path {
    stroke-dasharray: 16;
    animation: tickIn 220ms ease-out forwards;
  }

  /* Inputs */
  input, textarea, button, select { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }

  /* Soft shadow tokens */
  .shadow-card {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      0 1px 0 rgba(33,25,19,0.04),
      0 14px 32px -16px rgba(75,48,80,0.16),
      0 2px 6px -2px rgba(75,48,80,0.06);
  }
  .shadow-float {
    box-shadow:
      0 8px 24px -10px rgba(33,25,19,0.28),
      0 28px 56px -22px rgba(75,48,80,0.30),
      inset 0 1px 0 rgba(255,255,255,0.65);
  }
  .shadow-glow-terra { box-shadow: 0 12px 30px -14px rgba(197,99,75,0.45); }
  .shadow-glow-plum  { box-shadow: 0 12px 30px -14px rgba(75,48,80,0.45); }

  /* The phone frame */
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 52px;
    background: linear-gradient(155deg, #0F0B0E 0%, #1E1518 100%);
    padding: 12px;
    box-shadow:
      0 60px 120px -40px rgba(33,25,19,0.55),
      0 0 0 1px rgba(255,255,255,0.04) inset;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    background: var(--cream);
    isolation: isolate;
  }
  .notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; border-radius: 20px;
    background: #1a1612;
    z-index: 60;
  }

  /* Subtle dot pattern for placeholders */
  .dot-bg {
    background-image: radial-gradient(rgba(154,142,126,0.35) 1px, transparent 1px);
    background-size: 12px 12px;
  }

  /* Atmosphere — slow drifting color blobs + grain */
  .atmos-layer {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .atmos-layer svg { width: 100%; height: 100%; display: block; }

  @keyframes driftA { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(38px,-30px) scale(1.18); } }
  @keyframes driftB { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-36px,26px) scale(1.22); } }
  @keyframes driftC { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(28px,42px) scale(0.88); } }
  @keyframes driftD { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,-42px) scale(1.14); } }
  @keyframes driftE { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(46px,18px) scale(1.10); } }
  @keyframes hueDrift { 0%,100% { filter: hue-rotate(0deg) saturate(1); } 33% { filter: hue-rotate(-6deg) saturate(1.08); } 66% { filter: hue-rotate(8deg) saturate(0.96); } }
  @keyframes slowSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .blob { transform-origin: center; transform-box: fill-box; will-change: transform; mix-blend-mode: multiply; }
  .blob-a { animation: driftA 32s ease-in-out infinite; }
  .blob-b { animation: driftB 41s ease-in-out infinite; }
  .blob-c { animation: driftC 28s ease-in-out infinite; }
  .blob-d { animation: driftD 47s ease-in-out infinite; }
  .blob-e { animation: driftE 38s ease-in-out infinite; }
  .blob-group { animation: hueDrift 60s ease-in-out infinite; }
  .atmos-spin { transform-origin: 183px 410px; animation: slowSpin 180s linear infinite; }

  /* concentric rings, very faint */
  @keyframes ringPulse {
    0%,100% { transform: scale(1); opacity: 0.10; }
    50%     { transform: scale(1.06); opacity: 0.16; }
  }
  .atmos-rings { animation: ringPulse 18s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
</style>
</head>

  const Atmosphere = React.memo(function Atmosphere() {

        <rect width="100%" height="100%" filter="url(#g)" opacity="0.55"/>

    return (
      <div className="atmos-layer" aria-hidden="true">
        <svg viewBox="0 0 366 820" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="b-terra" cx="50%" cy="50%" r="50%">
              <stop offset="0%"  stopColor="#C5634B" stopOpacity="0.72"/>
              <stop offset="55%" stopColor="#C5634B" stopOpacity="0.16"/>
              <stop offset="100%" stopColor="#C5634B" stopOpacity="0"/>
            </radialGradient>
            <radialGradient id="b-sage" cx="50%" cy="50%" r="50%">
              <stop offset="0%"  stopColor="#7E977B" stopOpacity="0.62"/>

              <stop offset="100%" stopColor="#4B3050" stopOpacity="0"/>
            </radialGradient>
          </defs>

          <g className="blob-group">
            <circle className="blob blob-a" cx="60"  cy="120" r="220" fill="url(#b-terra)"/>
            <circle className="blob blob-b" cx="320" cy="220" r="250" fill="url(#b-sage)"/>
            <circle className="blob blob-c" cx="280" cy="560" r="240" fill="url(#b-rose)"/>
            <circle className="blob blob-d" cx="40"  cy="640" r="260" fill="url(#b-gold)"/>
            <circle className="blob blob-e" cx="200" cy="400" r="200" fill="url(#b-plum)"/>
          </g>

          {/* slow-rotating concentric rings — psychedelic anchor */}

                strokeDasharray={i % 2 ? "2 6" : "1 12"}
                opacity={0.55 - i*0.06}/>
            ))}
          </g>

          {/* faint radial spokes */}
          <g opacity="0.08" style={{ transformOrigin: "183px 410px" }}>
            {Array.from({ length: 24 }).map((_, i) => {
              const ang = (i/24) * Math.PI * 2;
              const x1 = 183 + Math.cos(ang) * 60;
              const y1 = 410 + Math.sin(ang) * 60;
              const x2 = 183 + Math.cos(ang) * 480;
              const y2 = 410 + Math.sin(ang) * 480;
              return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#3B2A33" strokeWidth="0.5"/>;
            })}
          </g>
        </svg>

        <div style={{
          position: "absolute", inset: 0,
          backgroundImage: `url("data:image/svg+xml;utf8,${grainSvg}")`,
          backgroundSize: "220px 220px",
          opacity: 0.42,
          mixBlendMode: "multiply",
          pointerEvents: "none",
        }}/>
      </div>
    );
  });

    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((d - today) / 86400000);
    const weekday = d.toLocaleDateString("de-DE", { weekday: "long" });
    const day = d.toLocaleDateString("de-DE", { day: "numeric", month: "long" });
    if (diff === 0) return `Heute · ${day}`;
    if (diff === 1) return `Morgen · ${day}`;
    if (diff === -1) return `Gestern · ${day}`;
    if (diff > 1 && diff < 7) return `${weekday} · ${day}`;
    return `${weekday}, ${day}`;
  };

    const d = new Date(iso + "T00:00:00");

    if (diff === 0) return "Heute";

  function diffDays(aIso, bIso) {
    const a = new Date(aIso + "T00:00:00");
    const b = new Date(bIso + "T00:00:00");
    return Math.round((a - b) / 86400000);
  }

  function addDays(iso, n) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }

  function cycleAnalysis(cycle, today = todayISO) {
    if (!cycle || !cycle.periodStarts.length) return null;
    const lastStart = cycle.periodStarts[cycle.periodStarts.length-1];
    const day = diffDays(today, lastStart) + 1;
    const cycLen = cycle.avgCycle;
    const ovulationDayInCycle = cycLen - 14; // luteal ~14d
    const fertileStart = ovulationDayInCycle - 3;
    const fertileEnd   = ovulationDayInCycle + 1;
    const nextPeriod = addDays(lastStart, cycLen);
    const ovulationDate = addDays(lastStart, ovulationDayInCycle - 1);

    let phase, phaseLabel, color;
    if (day <= cycle.avgPeriod) {
      phase = "menstruation"; phaseLabel = "Menstruation"; color = "#A8484E";
    } else if (day < fertileStart) {
      phase = "follikel"; phaseLabel = "Folliklephase"; color = "#D4A86A";
    } else if (day >= fertileStart && day <= fertileEnd) {
      phase = "fertil"; phaseLabel = day === ovulationDayInCycle ? "Eisprung" : "Fruchtbares Fenster"; color = "#E07A5F";
    } else if (day <= cycLen) {
      phase = "luteal"; phaseLabel = "Lutealphase"; color = "#8DA888";
    } else {
      // overdue
      phase = "ueberfaellig"; phaseLabel = `Überfällig (${day - cycLen} T.)`; color = "#A8484E";
    }

    return {
      day, cycLen,
      lastStart, nextPeriod, ovulationDate,
      ovulationDayInCycle, fertileStart, fertileEnd,
      daysUntilPeriod: cycLen - day,
      daysUntilOvulation: ovulationDayInCycle - day,
      phase, phaseLabel, color,
      isFertile: day >= fertileStart && day <= fertileEnd,
      isOvulation: day === ovulationDayInCycle,
      isPeriod: day <= cycle.avgPeriod,
    };
  }

    if (dayInCycle <= ov + 1) return "fertil";
    if (dayInCycle <= cycle.avgCycle) return "luteal";

  function toICS(activity) {

    const end = new Date(start.getTime() + 60*60*1000);

      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AmbarDallen//Prototype//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",

      `UID:${activity.id}@ambardallen.app`,

      `DTSTART:${fmt(start)}`,
      `DTEND:${fmt(end)}`,
      `SUMMARY:${escape(activity.title)}`,
      activity.place ? `LOCATION:${escape(activity.place)}` : null,
      activity.note ? `DESCRIPTION:${escape(activity.note)}` : null,
      "END:VEVENT","END:VCALENDAR",
    ].filter(Boolean).join("\r\n");
  }

    const [quickAddInput, setQuickAddInput] = useState("");
    const myActivities = visibleTo(activities, currentUser);
    const myShopping   = visibleTo(shopping, currentUser);
    const myTodos      = visibleTo(todos, currentUser);
    const myGoals      = visibleTo(goals, currentUser);

    const todayActs = myActivities.filter(a => a.date === todayISO && a.status !== "erledigt");
    const nextAct = todayActs[0] || myActivities
      .filter(a => a.status === "geplant" && a.date && a.date > todayISO)
      .sort((a,b) => a.date.localeCompare(b.date))[0];
    const openShop = myShopping.filter(s => !s.done && !s.spinnerei);

    // Urgent todos for "Aufgaben" pinnwand
    const urgentTodos = myTodos
      .filter(t => !t.done && (!t.due || t.due <= offset(7)))
      .sort((a, b) => {
        const ba = dueBucket(a.due), bb = dueBucket(b.due);
        const order = { ueber:0, heute:1, morgen:2, woche:3, kein:4 };
        if ((order[ba]||5) !== (order[bb]||5)) return (order[ba]||5) - (order[bb]||5);
        return (PRIO[a.prio]?.rank ?? 1) - (PRIO[b.prio]?.rank ?? 1);
      })
      .slice(0, 4);

    const topGoal = myGoals.find(g => g.scope === "geteilt") || myGoals[0];

    const now = new Date();
    const greet = now.getHours() < 11 ? "Guten Morgen" : now.getHours() < 18 ? "Hallo ihr zwei" : "Schönen Abend";
    const dateLine = now.toLocaleDateString("de-DE", { weekday:"long", day:"numeric", month:"long" });

    return (
      <div className="phone-scroll overflow-y-auto h-full pt-[48px] pb-[96px]">
        <div className="px-4 pt-1 pb-3">
          <div className="uplabel text-[10.5px] text-[var(--muted)]">{dateLine}</div>
          <div className="flex items-end justify-between gap-3 mt-1">
            <h1 className="text-[30px] font-semibold leading-tight tracking-tight flex-1 min-w-0">{greet}</h1>
            <AvatarPair size={28}/>
          </div>
        </div>

        {/* Featured: Cycle tile */}
        {cycle && (
          <div className="px-4 mb-2">
            <CycleTile cycle={cycle} onOpen={onOpenCycle} canEdit={currentUser === cycle.owner}/>
          </div>
        )}

        {/* Asymmetric 2-column grid: left stacked tiles, right tall Einkauf */}
        <div className="px-4 mb-3 grid grid-cols-2 gap-2 items-stretch">
          <div className="flex flex-col gap-2">
            {/* Termin tile */}
            <Card onClick={() => nextAct ? openActivity(nextAct) : goTab("akt")} className="p-3 flex-1">
              <div className="uplabel text-[10px] text-[var(--muted)] mb-1.5 flex items-center justify-between gap-1">
                <span>Termine</span>
                {nextAct && (
                  <span className="text-[10px] normal-case tracking-normal font-medium" style={{ color: USERS[nextAct.by].color }}>
                    {shortDate(nextAct.date)}
                  </span>
                )}
              </div>
              {nextAct ? (
                <>
                  <div className="text-[14px] font-semibold leading-snug line-clamp-2 mb-0.5 flex items-start gap-1.5">
                    {isPrivate(nextAct) && <IconLock size={10} strokeWidth={2} className="text-[var(--muted)] shrink-0 mt-1"/>}
                    <span>{nextAct.title}</span>
                  </div>
                  <div className="text-[11.5px] text-[var(--ink-soft)] truncate">
                    {nextAct.time && <span>{nextAct.time}</span>}{nextAct.place && ` · ${nextAct.place}`}
                  </div>
                </>
              ) : (
                <div className="text-[12.5px] text-[var(--muted)] italic">nichts geplant</div>
              )}
            </Card>

            {/* Goal mini */}
            {topGoal && (
              <Card onClick={() => openGoal(topGoal)} className="p-3 flex-1">
                <div className="uplabel text-[10px] text-[var(--muted)] mb-1.5 flex items-center gap-1">
                  Im Blick {isPrivate(topGoal) && <IconLock size={9} strokeWidth={2}/>}
                </div>
                <div className="text-[12.5px] font-semibold leading-snug line-clamp-2 mb-2">{topGoal.title}</div>
                <GoalProgress goal={topGoal}/>
              </Card>
            )}
          </div>

          {/* Einkauf — tall card matching the height of left column */}
          <Card className="p-0 overflow-hidden flex flex-col">
            <div className="px-3 pt-2.5 pb-1.5 flex items-center justify-between">
              <div className="uplabel text-[10px] text-[var(--ink-soft)] inline-flex items-center gap-1.5">
                <IconCart size={11}/> Einkauf
              </div>
              <button onClick={() => goTab("shop")} className="uplabel text-[9.5px] text-[var(--muted)] tap">
                {openShop.length} offen
              </button>
            </div>
            <div className="flex-1 overflow-hidden">
              {openShop.length === 0 ? (
                <div className="px-3 py-3 text-[12px] text-[var(--ink-soft)] italic">leer ✓</div>
              ) : (
                <div className="phone-scroll overflow-y-auto h-full">
                  {openShop.map((s) => (
                    <div key={s.id}
                      onClick={(e) => { e.stopPropagation(); openShopping(s); }}
                      className="flex items-center gap-2 px-2.5 py-1.5 tap cursor-pointer border-b border-[var(--line)]/40 last:border-0">
                      <RoundCheck checked={false} onClick={() => toggleShopping(s.id)} size={16} color="var(--sage)"/>
                      <div className="flex-1 min-w-0">
                        <div className="text-[12px] truncate">{s.text}</div>
                      </div>
                      {isPrivate(s) && <IconLock size={8} strokeWidth={2} className="text-[var(--muted)] shrink-0"/>}
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="border-t border-[var(--line)]/60 bg-[var(--cream-deep)]/30 px-1.5 py-1 flex items-center gap-1">
              <input
                value={quickAddInput}
                onChange={e => setQuickAddInput(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && quickAddInput.trim()) { quickAddShopping(quickAddInput); setQuickAddInput(""); } }}
                placeholder="+ hinzufügen"
                className="flex-1 bg-transparent text-[12px] py-1 px-1.5 placeholder:text-[var(--muted)] min-w-0"/>
              <button onClick={() => { if (quickAddInput.trim()) { quickAddShopping(quickAddInput); setQuickAddInput(""); } }}
                className="tap w-6 h-6 rounded-md bg-[var(--terra)] text-white flex items-center justify-center shrink-0">
                <IconPlus size={12}/>
              </button>
            </div>
          </Card>
        </div>

        {/* Aufgaben — Pinnwand-style */}
        <div className="px-4 mb-2">
          <div className="flex items-center justify-between mb-1.5 gap-2">
            <h2 className="uplabel text-[10.5px] text-[var(--ink-soft)]">Aufgaben</h2>
            <button onClick={() => goTab("todo")} className="uplabel text-[10.5px] text-[var(--terra)] tap whitespace-nowrap shrink-0">
              Alle
            </button>
          </div>
          {urgentTodos.length === 0 ? (
            <Card className="p-3">
              <div className="text-[13px] text-[var(--ink-soft)] italic">Keine offenen Aufgaben für die kommenden Tage.</div>
            </Card>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {urgentTodos.map(t => {
                const p = PRIO[t.prio] || PRIO.normal;
                const bucket = dueBucket(t.due);
                const isOver = bucket === "ueber";
                const bucketLabel = bucket === "kein" ? "" : BUCKET_LABEL[bucket];
                return (
                  <Card key={t.id} onClick={() => openTodo(t)} className="p-2.5 relative">
                    {/* Priority strip on left */}
                    <div className="absolute left-0 top-2 bottom-2 w-[3px] rounded-r"
                      style={{ background: p.color, opacity: p.dot ? 1 : 0.35 }}/>
                    <div className="pl-1.5">
                      <div className="flex items-center justify-between gap-1 mb-1">
                        <span className="uplabel text-[9px] whitespace-nowrap"
                          style={{ color: isOver ? "#C5634B" : "var(--muted)" }}>
                          {bucketLabel || "Offen"}
                        </span>
                        <AvatarWithScope by={t.by} scope={t.scope} size={14}/>
                      </div>
                      <div className="text-[12.5px] font-semibold leading-snug line-clamp-3 mb-1">{t.text}</div>
                      <div className="flex items-center gap-1.5">
                        <span onClick={(e) => e.stopPropagation()}
                          className="inline-flex items-center gap-1 text-[10.5px] text-[var(--ink-soft)]">
                          <RoundCheck checked={false} onClick={() => toggleTodo(t.id)} size={14} color={p.color}/>
                          erledigen
                        </span>
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  };

  const SectionTitle = ({ title, action }) => (
    <div className="flex items-center justify-between mb-1.5 mt-0.5 gap-2">
      <h2 className="uplabel text-[10.5px] text-[var(--ink-soft)]">{title}</h2>
      {action && (
        <button onClick={action.onClick} className="uplabel text-[10.5px] text-[var(--terra)] tap whitespace-nowrap shrink-0">
          {action.label}
        </button>
      )}
    </div>
  );

  const Tag = ({ label }) => (
    <span className="inline-flex items-center px-2 py-0.5 text-[11.5px] rounded-full bg-[var(--cream-deep)] text-[var(--ink-soft)]">
      #{label}
    </span>
  );

  const ActivityIcon = ({ kind }) => {
    const map = { coffee: IconCoffee, leaf: IconLeaf, heart: IconHeart, sparkle: IconSparkle, book: IconBook, house: IconHouse };
    const Icon = map[kind] || IconCal;
    return (
      <div className="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center"
        style={{ background: "var(--cream-deep)", color: "var(--ink)" }}>
        <Icon size={18}/>
      </div>
    );
  };

  const GoalProgress = ({ goal }) => {
    const pct = Math.min(100, Math.round((goal.current/goal.target) * 100));
    return (
      <div>
        <div className="h-2 rounded-full bg-[var(--cream-deep)] overflow-hidden">
          <div className="h-full rounded-full transition-all duration-500"
            style={{ width: `${pct}%`, background: USERS[goal.by].color }}/>
        </div>
        <div className="flex justify-between text-[12.5px] text-[var(--ink-soft)] mt-1.5">
          <span>{goal.current} / {goal.target}{goal.title.includes("Sparen") ? " €" : ""}</span>
          <span>{pct}%</span>
        </div>
      </div>
    );
  };

  /* ============================================================
     SCREEN: AKTIVITÄTEN
     ============================================================ */
  const AktScreen = ({ currentUser, activities, openActivity, addActivity }) => {
    const [filter, setFilter] = useState("geplant");
    const [scopeFilter, setScopeFilter] = useState("alle"); // alle | geteilt | nur-ich
    const filtered = useMemo(() => {
      let arr = visibleTo(activities, currentUser);
      arr = arr.filter(a => a.status === filter);
      if (scopeFilter === "geteilt") arr = arr.filter(a => a.scope === "geteilt");
      if (scopeFilter === "nur-ich") arr = arr.filter(a => a.scope === currentUser);
      return arr.sort((a,b) => {
        if (!a.date) return 1;
        if (!b.date) return -1;
        return a.date.localeCompare(b.date);
      });
    }, [activities, filter, scopeFilter, currentUser]);

    // group by date label
    const grouped = useMemo(() => {
      const map = new Map();
      filtered.forEach(a => {
        const key = a.date ? a.date : "ohne-datum";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(a);
      });
      return Array.from(map.entries());
    }, [filtered]);

    return (
      <div className="phone-scroll overflow-y-auto h-full pt-[48px] pb-[96px]">
        <ScreenHeader title="Aktivitäten" subtitle="Gemeinsam unterwegs"
          right={
            <button onClick={addActivity}
              className="tap w-9 h-9 rounded-full bg-[var(--terra)] text-white shadow-card flex items-center justify-center">
              <IconPlus size={18}/>
            </button>
          }/>
        <div className="px-4 pb-1.5">
          <Segmented value={filter} onChange={setFilter}
            options={[
              { value: "geplant",  label: "Geplant" },
              { value: "idee",     label: "Ideen" },
              { value: "erledigt", label: "Erledigt" },
            ]}/>
        </div>
        <div className="px-4 pb-1.5 flex gap-1.5">
          {[
            { v: "alle",    l: "Alle" },
            { v: "geteilt", l: "Gemeinsam", icon: <IconUsers size={11}/> },
            { v: "nur-ich", l: `Nur ${USERS[currentUser].name}`, icon: <IconLock size={11} strokeWidth={2}/> },
          ].map(o => (
            <button key={o.v} onClick={() => setScopeFilter(o.v)}
              className={`px-2.5 py-1 text-[11.5px] rounded-full font-medium tap inline-flex items-center gap-1 ${
                scopeFilter===o.v ? "bg-[var(--ink)] text-[var(--paper)]" : "bg-[var(--cream-deep)] text-[var(--ink-soft)]"
              }`}>
              {o.icon}{o.l}
            </button>
          ))}
        </div>

        <div className="px-4 mt-1.5 space-y-3.5">
          {grouped.length === 0 && (
            <Empty icon={<IconCal size={22}/>} title="Noch nichts hier"
              body={ filter === "idee" ? "Sammle Ideen für Dates und Ausflüge — ohne Druck." : "Plant euer nächstes Abenteuer." }/>
          )}
          {grouped.map(([date, items]) => (
            <div key={date}>
              <div className="text-[11px] uppercase tracking-[0.14em] text-[var(--muted)] mb-1.5 px-1">
                {date === "ohne-datum" ? "Ohne Datum" : formatDate(date)}
              </div>
              <div className="space-y-1.5">
                {items.map(a => (
                  <Card key={a.id} onClick={() => openActivity(a)} className="p-3 flex items-center gap-3">
                    <ActivityIcon kind={a.icon}/>
                    <div className="flex-1 min-w-0">
                      <div className="text-[14.5px] font-medium truncate">{a.title}</div>
                      <div className="text-[12px] text-[var(--ink-soft)] mt-0.5 flex items-center gap-2">
                        {a.time && <span className="inline-flex items-center gap-1"><IconClock size={11}/>{a.time}</span>}
                        {a.place && <span className="truncate">· {a.place}</span>}
                      </div>
                    </div>
                    <AvatarWithScope by={a.by} scope={a.scope} size={20}/>
                  </Card>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  };

  /* ============================================================
     SCREEN: EINKAUF
     ============================================================ */

  /* Compact reusable shopping row — used on Heute too */
  const ShoppingRow = ({ s, onToggle, onOpen, dense = false }) => (
    <div onClick={(e) => { e.stopPropagation(); onOpen && onOpen(s); }}
      className={`flex items-center gap-2.5 ${dense ? "px-2.5 py-2" : "px-3 py-2.5"} tap cursor-pointer`}>
      <RoundCheck checked={s.done} onClick={() => onToggle && onToggle(s.id)} size={dense ? 20 : 22}
        color={s.spinnerei ? "var(--terra)" : "var(--sage)"}/>
      <div className="flex-1 min-w-0">
        <div className={`${dense ? "text-[13.5px]" : "text-[14px]"} ${s.done ? "line-through text-[var(--muted)]" : ""} flex items-center gap-1.5`}>
          {s.spinnerei && !s.done && <span className="text-[var(--terra)]">✦</span>}
          <span className="truncate">{s.text}</span>
        </div>
        {(s.qty || s.added) && (
          <div className="text-[11px] text-[var(--muted)] mt-0.5 truncate">
            {s.qty && <span>{s.qty}{s.added ? " · " : ""}</span>}{s.added}
          </div>
        )}
      </div>
      <AvatarWithScope by={s.by} scope={s.scope} size={dense ? 18 : 20}/>
    </div>
  );

  const ShopScreen = ({ shopping, setShopping, openShopping, currentUser }) => {
    const [input, setInput] = useState("");
    const [spinnerei, setSpinnerei] = useState(false);
    const [scopeForNew, setScopeForNew] = useState("geteilt");
    const [showDone, setShowDone] = useState(false);

    const visibleShopping = useMemo(() => visibleTo(shopping, currentUser), [shopping, currentUser]);

    const add = () => {
      if (!input.trim()) return;
      setShopping([{
        id: uid(), text: input.trim(), spinnerei,
        done: false, by: currentUser, scope: scopeForNew, qty: "", added: "gerade eben",
      }, ...shopping]);
      setInput("");
    };

    const toggle = (id) => setShopping(shopping.map(s => s.id===id ? {...s, done: !s.done} : s));

    const openItems    = visibleShopping.filter(s => !s.done);
    const gemeinsam    = openItems.filter(s => !s.spinnerei && s.scope === "geteilt");
    const privat       = openItems.filter(s => !s.spinnerei && s.scope === currentUser);
    const spinnereiArr = openItems.filter(s =>  s.spinnerei);
    const doneItems    = visibleShopping.filter(s => s.done);

    const sections = [
      { key: "gemeinsam", label: "Gemeinsam", items: gemeinsam,    accent: "var(--sage)",  icon: <IconUsers size={11}/> },
      { key: "privat",    label: `Privat · ${USERS[currentUser].name}`, items: privat,     accent: USERS[currentUser].color, icon: <IconLock size={11} strokeWidth={2}/> },
      { key: "spinnerei", label: "Spinnerei", items: spinnereiArr, accent: "var(--terra)", icon: <span className="text-[var(--terra)]">✦</span>, hint: "Wünsche & Nice-to-haves" },
    ];

    return (
      <div className="phone-scroll overflow-y-auto h-full pt-[48px] pb-[96px]">
        <ScreenHeader title="Einkauf" subtitle={`${openItems.length} offen`}
          right={<AvatarPair size={24}/>}/>

        {/* Quick add */}
        <div className="px-4 pb-2.5">
          <div className="bg-[var(--paper)] rounded-2xl shadow-card p-2">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-xl bg-[var(--cream-deep)] flex items-center justify-center text-[var(--terra)] shrink-0">
                <IconPlus size={16}/>
              </div>
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") add(); }}
                placeholder="Was fehlt?"
                className="flex-1 bg-transparent text-[14.5px] placeholder:text-[var(--muted)] py-1"/>
              <button onClick={add}
                className="tap text-[13px] font-medium px-3 py-1.5 rounded-full text-white"
                style={{ background: input.trim() ? "var(--terra)" : "var(--terra-soft)" }}>
                Hinzu
              </button>
            </div>
            <div className="mt-2 pl-1 flex items-center justify-between gap-2">
              <div className="inline-flex p-0.5 rounded-full bg-[var(--cream-deep)]">
                <button onClick={() => { setScopeForNew("geteilt"); setSpinnerei(false); }}
                  className={`px-2.5 py-0.5 text-[11.5px] rounded-full tap font-medium inline-flex items-center gap-1 ${scopeForNew==="geteilt" && !spinnerei ? "bg-[var(--paper)] text-[var(--ink)] shadow-card" : "text-[var(--ink-soft)]"}`}>
                  <IconUsers size={11}/> Gemeinsam
                </button>
                <button onClick={() => { setScopeForNew(currentUser); setSpinnerei(false); }}
                  className={`px-2.5 py-0.5 text-[11.5px] rounded-full tap font-medium inline-flex items-center gap-1 ${scopeForNew===currentUser && !spinnerei ? "bg-[var(--paper)] text-[var(--ink)] shadow-card" : "text-[var(--ink-soft)]"}`}>
                  <IconLock size={11} strokeWidth={2}/> Privat
                </button>
                <button onClick={() => setSpinnerei(true)}
                  className={`px-2.5 py-0.5 text-[11.5px] rounded-full tap font-medium inline-flex items-center gap-1 ${spinnerei ? "bg-[var(--paper)] text-[var(--terra)] shadow-card" : "text-[var(--ink-soft)]"}`}>
                  <span>✦</span> Spinnerei
                </button>
              </div>
            </div>
          </div>
        </div>

        {/* Three sections */}
        <div className="px-4 space-y-3">
          {sections.map(sec => sec.items.length > 0 && (
            <div key={sec.key}>
              <div className="flex items-center gap-1.5 mb-1.5 px-1">
                <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: sec.accent }}/>
                <h2 className="uplabel text-[10.5px] text-[var(--ink-soft)] inline-flex items-center gap-1">
                  {sec.icon} {sec.label}
                </h2>
                <span className="text-[11px] text-[var(--muted)]">· {sec.items.length}</span>
                {sec.hint && <span className="text-[10.5px] text-[var(--muted)] italic ml-auto">{sec.hint}</span>}
              </div>
              <Card className="p-1">
                {sec.items.map((s, i) => (
                  <div key={s.id} className={i < sec.items.length-1 ? "border-b border-[var(--line)]/60" : ""}>
                    <ShoppingRow s={s} onToggle={toggle} onOpen={openShopping}/>
                  </div>
                ))}
              </Card>
            </div>
          ))}

          {/* Done */}
          {doneItems.length > 0 && (
            <div>
              <button onClick={() => setShowDone(!showDone)}
                className="flex items-center gap-1.5 px-1 py-1 uplabel text-[10.5px] text-[var(--ink-soft)] tap">
                Erledigt · {doneItems.length}
                <IconChev size={12} className={`transition-transform ${showDone ? "rotate-90" : ""}`}/>
              </button>
              {showDone && (
                <Card className="p-1 mt-1">
                  {doneItems.map((s, i) => (
                    <div key={s.id} className={i < doneItems.length-1 ? "border-b border-[var(--line)]/60" : ""}>
                      <ShoppingRow s={s} onToggle={toggle} onOpen={openShopping} dense/>
                    </div>
                  ))}
                </Card>
              )}
            </div>
          )}

          {visibleShopping.length === 0 && (
            <Empty icon={<IconCart size={22}/>} title="Liste ist leer" body="Tippe oben ein, was als nächstes mit muss."/>
          )}
        </div>
      </div>
    );
  };

  /* ============================================================
     SCREEN: TODO
     ============================================================ */
  const PRIO = {
    hoch:   { label: "Hoch",   color: "#C5634B", dot: true,  rank: 0 },
    normal: { label: "Normal", color: "#7E977B", dot: false, rank: 1 },
    tief:   { label: "Tief",   color: "#978675", dot: false, rank: 2 },
  };

  function dueBucket(due) {
    if (!due) return "kein";
    const d = diffDays(due, todayISO);
    if (d < 0)  return "ueber";
    if (d === 0) return "heute";
    if (d === 1) return "morgen";
    if (d <= 7)  return "woche";
    return "spaeter";
  }
  const BUCKET_LABEL = {
    ueber:   "Überfällig",
    heute:   "Heute",
    morgen:  "Morgen",
    woche:   "Diese Woche",
    spaeter: "Später",
    kein:    "Ohne Datum",
  };

  const TodoRow = ({ t, onToggle, onOpen, dense = false }) => {
    const p = PRIO[t.prio] || PRIO.normal;
    return (
      <div onClick={(e) => { e.stopPropagation(); onOpen && onOpen(t); }}
        className={`flex items-start gap-2.5 ${dense ? "px-2.5 py-2" : "px-3 py-2.5"} tap cursor-pointer`}>
        <div className="pt-0.5">
          <RoundCheck checked={t.done} onClick={() => onToggle && onToggle(t.id)} size={dense ? 20 : 22}
            color={p.color}/>
        </div>
        <div className="flex-1 min-w-0">
          <div className={`${dense ? "text-[13.5px]" : "text-[14px]"} ${t.done ? "line-through text-[var(--muted)]" : ""} flex items-center gap-1.5`}>
            {p.dot && !t.done && <span className="inline-block w-1.5 h-1.5 rounded-full shrink-0" style={{ background: p.color }}/>}
            <span className="truncate">{t.text}</span>
          </div>
          {(t.due || t.note) && (
            <div className="text-[11px] text-[var(--muted)] mt-0.5 flex items-center gap-1.5 truncate">
              {t.due && <span className={t.due < todayISO && !t.done ? "text-[#C5634B] font-medium" : ""}>{shortDate(t.due)}</span>}
              {t.note && t.due && <span>·</span>}
              {t.note && <span className="truncate">{t.note.split("\n")[0]}</span>}
            </div>
          )}
        </div>
        <AvatarWithScope by={t.by} scope={t.scope} size={dense ? 18 : 20}/>
      </div>
    );
  };

  const TodoScreen = ({ currentUser, todos, openTodo, addTodo, toggleTodo }) => {
    const [query, setQuery] = useState("");
    const [scopeFilter, setScopeFilter] = useState("alle");
    const [showDone, setShowDone] = useState(false);

    const myTodos = useMemo(() => {
      let arr = visibleTo(todos, currentUser);
      if (scopeFilter === "geteilt") arr = arr.filter(t => t.scope === "geteilt");
      if (scopeFilter === "nur-ich") arr = arr.filter(t => t.scope === currentUser);
      if (query.trim()) {
        const q = query.toLowerCase();
        arr = arr.filter(t => t.text.toLowerCase().includes(q) || (t.note||"").toLowerCase().includes(q));
      }
      return arr;
    }, [todos, scopeFilter, query, currentUser]);

    const openItems = myTodos.filter(t => !t.done);
    const doneItems = myTodos.filter(t => t.done);

    const buckets = useMemo(() => {
      const order = ["ueber","heute","morgen","woche","spaeter","kein"];
      const m = Object.fromEntries(order.map(k => [k, []]));
      openItems.forEach(t => {
        m[dueBucket(t.due)].push(t);
      });
      // sort within bucket: prio rank, then due asc
      Object.values(m).forEach(arr => arr.sort((a,b) => {
        const pr = (PRIO[a.prio]?.rank ?? 1) - (PRIO[b.prio]?.rank ?? 1);
        if (pr !== 0) return pr;
        if (a.due && b.due) return a.due.localeCompare(b.due);
        return 0;
      }));
      return order.map(k => [k, m[k]]).filter(([_,arr]) => arr.length);
    }, [openItems]);

    return (
      <div className="phone-scroll overflow-y-auto h-full pt-[48px] pb-[96px]">
        <ScreenHeader title="Todo" subtitle={`${openItems.length} offen`}
          right={
            <button onClick={addTodo}
              className="tap w-9 h-9 rounded-full bg-[var(--terra)] text-white shadow-card flex items-center justify-center">
              <IconPlus size={18}/>
            </button>
          }/>

        {/* Search */}
        <div className="px-4 pb-1.5">
          <div className="flex items-center gap-2 bg-[var(--paper)] rounded-2xl px-3 py-2 shadow-card">
            <IconSearch size={16} className="text-[var(--muted)]"/>
            <input value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Suchen…"
              className="flex-1 bg-transparent text-[14px] placeholder:text-[var(--muted)]"/>
            {query && <button onClick={()=>setQuery("")} className="text-[var(--muted)] tap"><IconX size={14}/></button>}
          </div>
        </div>

        {/* Scope filter */}
        <div className="px-4 pb-2 flex gap-1.5">
          {[
            { v: "alle",    l: "Alle" },
            { v: "geteilt", l: "Gemeinsam", icon: <IconUsers size={11}/> },
            { v: "nur-ich", l: `Privat`, icon: <IconLock size={11} strokeWidth={2}/> },
          ].map(o => (
            <button key={o.v} onClick={() => setScopeFilter(o.v)}
              className={`px-2.5 py-1 text-[11.5px] rounded-full font-medium tap inline-flex items-center gap-1 ${
                scopeFilter===o.v ? "bg-[var(--ink)] text-[var(--paper)]" : "bg-[var(--cream-deep)] text-[var(--ink-soft)]"
              }`}>
              {o.icon}{o.l}
            </button>
          ))}
        </div>

        <div className="px-4 space-y-3">
          {buckets.length === 0 && doneItems.length === 0 && (
            <Empty icon={<IconCheckSquare size={22}/>} title={query ? "Nichts gefunden" : "Alles erledigt"}
              body={query ? "Andere Suche probieren?" : "Du bist auf dem Laufenden."}/>
          )}
          {buckets.map(([k, arr]) => (
            <div key={k}>
              <div className="flex items-center gap-1.5 mb-1.5 px-1">
                <span className="inline-block w-1.5 h-1.5 rounded-full"
                  style={{ background: k==="ueber" ? "#C5634B" : k==="heute" ? "var(--terra)" : "var(--ink-soft)" }}/>
                <h2 className="uplabel text-[10.5px] text-[var(--ink-soft)]">{BUCKET_LABEL[k]}</h2>
                <span className="text-[11px] text-[var(--muted)]">· {arr.length}</span>
              </div>
              <Card className="p-1">
                {arr.map((t, i) => (
                  <div key={t.id} className={i < arr.length-1 ? "border-b border-[var(--line)]/60" : ""}>
                    <TodoRow t={t} onToggle={toggleTodo} onOpen={openTodo}/>
                  </div>
                ))}
              </Card>
            </div>
          ))}

          {/* Done */}
          {doneItems.length > 0 && (
            <div>
              <button onClick={() => setShowDone(!showDone)}
                className="flex items-center gap-1.5 px-1 py-1 uplabel text-[10.5px] text-[var(--ink-soft)] tap">
                Erledigt · {doneItems.length}
                <IconChev size={12} className={`transition-transform ${showDone ? "rotate-90" : ""}`}/>
              </button>
              {showDone && (
                <Card className="p-1 mt-1">
                  {doneItems.map((t, i) => (
                    <div key={t.id} className={i < doneItems.length-1 ? "border-b border-[var(--line)]/60" : ""}>
                      <TodoRow t={t} onToggle={toggleTodo} onOpen={openTodo} dense/>
                    </div>
                  ))}
                </Card>
              )}
            </div>
          )}
        </div>
      </div>
    );
  };
  /* ============================================================
     SCREEN: ZIELE
     ============================================================ */
  const TERM_LABEL = { kurz: "Kurzfristig", mittel: "Mittelfristig", lang: "Langfristig" };
  const TERM_ORDER = ["kurz","mittel","lang"];

  const GoalScreen = ({ currentUser, goals, openGoal, addGoal }) => {
    const [scopeFilter, setScopeFilter] = useState("alle");
    const myGoals = useMemo(() => {
      let arr = visibleTo(goals, currentUser);
      if (scopeFilter === "geteilt") arr = arr.filter(g => g.scope === "geteilt");
      if (scopeFilter === "nur-ich") arr = arr.filter(g => g.scope === currentUser);
      return arr;
    }, [goals, scopeFilter, currentUser]);
    const grouped = useMemo(() => {
      const m = {};
      TERM_ORDER.forEach(k => m[k] = []);
      myGoals.forEach(g => m[g.term].push(g));
      return m;
    }, [myGoals]);

    return (
      <div className="phone-scroll overflow-y-auto h-full pt-[48px] pb-[96px]">
        <ScreenHeader title="Ziele" subtitle="Wohin wir wollen"
          right={
            <button onClick={addGoal}
              className="tap w-9 h-9 rounded-full bg-[var(--terra)] text-white shadow-card flex items-center justify-center">
              <IconPlus size={18}/>
            </button>
          }/>

        <div className="px-4 pb-1.5 flex gap-1.5">
          {[
            { v: "alle",    l: "Alle" },
            { v: "geteilt", l: "Gemeinsam", icon: <IconUsers size={11}/> },
            { v: "nur-ich", l: `Nur ${USERS[currentUser].name}`, icon: <IconLock size={11} strokeWidth={2}/> },
          ].map(o => (
            <button key={o.v} onClick={() => setScopeFilter(o.v)}
              className={`px-2.5 py-1 text-[11.5px] rounded-full font-medium tap inline-flex items-center gap-1 ${
                scopeFilter===o.v ? "bg-[var(--ink)] text-[var(--paper)]" : "bg-[var(--cream-deep)] text-[var(--ink-soft)]"
              }`}>
              {o.icon}{o.l}
            </button>
          ))}
        </div>

        <div className="px-4 space-y-3.5">
          {TERM_ORDER.map(term => {
            const items = grouped[term];
            if (items.length === 0) return null;
            return (
              <div key={term}>
                <div className="flex items-center gap-1.5 mb-1.5 px-1">
                  <IconFlag size={12} className="text-[var(--ink-soft)]"/>
                  <h2 className="text-[11.5px] font-semibold uppercase tracking-[0.16em] text-[var(--ink-soft)]">{TERM_LABEL[term]}</h2>
                </div>
                <div className="space-y-1.5">
                  {items.map(g => {
                    const doneSteps = g.steps.filter(s=>s.done).length;
                    return (
                      <Card key={g.id} onClick={()=>openGoal(g)} className="p-3.5">
                        <div className="flex items-start justify-between gap-3 mb-1.5">
                          <div className="text-[14.5px] font-medium leading-snug pr-2">{g.title}</div>
                          <AvatarWithScope by={g.by} scope={g.scope} size={20}/>
                        </div>
                        <GoalProgress goal={g}/>
                        <div className="flex items-center justify-between mt-2 text-[11.5px] text-[var(--muted)]">
                          <span>{doneSteps} / {g.steps.length} Schritte</span>
                          <span className="inline-flex items-center gap-1 text-[var(--terra)] font-medium">
                            Öffnen <IconChev size={11}/>
                          </span>
                        </div>
                      </Card>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  /* ============================================================
     DETAIL SHEETS
     ============================================================ */
  const ActivityDetail = ({ activity, onClose, onChange, onDelete, currentUser }) => {
    const a = activity;
    if (!a) return null;
    return (
      <Sheet open={!!a} onClose={onClose} title="Aktivität">
        <div className="flex items-center gap-3 mb-4">
          <ActivityIcon kind={a.icon}/>
          <div className="flex-1 min-w-0">
            <div className="serif-i text-[22px] leading-tight">{a.title}</div>
            <div className="text-[13px] text-[var(--ink-soft)] mt-1">
              {a.date ? formatDate(a.date) : "Ohne Datum"}{a.time && ` · ${a.time}`}
            </div>
          </div>
        </div>

        <div className="space-y-2">
          {a.place && (
            <DetailRow label="Ort" value={a.place} icon={<IconPin size={16}/>}/>
          )}
          <DetailRow label="Hinzugefügt von"
            value={<span className="inline-flex items-center gap-2"><Avatar id={a.by} size={20}/>{USERS[a.by].name}</span>}
            icon={<IconHeart size={16}/>}/>
          {a.note && (
            <div className="bg-[var(--cream-deep)]/60 rounded-2xl p-3.5 mt-3">
              <div className="text-[11.5px] uppercase tracking-[0.12em] text-[var(--muted)] mb-1">Notiz</div>
              <div className="text-[14.5px] whitespace-pre-line leading-relaxed">{a.note}</div>
            </div>
          )}
        </div>

        <div className="flex items-center justify-between mt-4">
          <div className="text-[11.5px] uppercase tracking-[0.12em] text-[var(--muted)]">Sichtbar für</div>
          <ScopeToggle value={a.scope || "geteilt"}
            onChange={(s) => onChange({ ...a, scope: s })}
            currentUser={currentUser} compact/>
        </div>

        <div className="flex gap-2 mt-5">
          {a.status !== "erledigt" ? (
            <button onClick={() => { onChange({ ...a, status: "erledigt" }); onClose(); }}
              className="flex-1 py-3 rounded-2xl bg-[var(--sage)] text-white text-[15px] font-semibold tap">
              Erledigt ✓
            </button>
          ) : (
            <button onClick={() => { onChange({ ...a, status: "geplant" }); onClose(); }}
              className="flex-1 py-3 rounded-2xl bg-[var(--cream-deep)] text-[var(--ink)] text-[15px] font-semibold tap">
              Wieder planen
            </button>
          )}
          {a.status === "idee" && (
            <button onClick={() => { onChange({ ...a, status: "geplant" }); onClose(); }}
              className="flex-1 py-3 rounded-2xl bg-[var(--terra)] text-white text-[15px] font-semibold tap">
              Einplanen
            </button>
          )}
          <button onClick={() => { onDelete(a.id); onClose(); }}
            className="px-4 rounded-2xl bg-[var(--cream-deep)] text-[var(--ink-soft)] tap">
            <IconX size={18}/>
          </button>
        </div>

        {/* iCal export */}
        {a.date && a.status !== "erledigt" && (
          <button onClick={() => downloadICS(a)}
            className="w-full mt-2.5 py-3 rounded-2xl bg-[var(--cream-deep)] text-[var(--ink)] text-[14.5px] font-semibold tap inline-flex items-center justify-center gap-2">
            <IconCal size={16}/> Zum iPhone Kalender hinzufügen
          </button>
        )}
      </Sheet>
    );
  };

  const DetailRow = ({ label, value, icon }) => (
    <div className="flex items-center gap-3 py-2 border-b border-[var(--line)]/60 last:border-0">
      <div className="w-8 h-8 rounded-xl bg-[var(--cream-deep)] flex items-center justify-center text-[var(--ink-soft)] shrink-0">
        {icon}
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-[11.5px] uppercase tracking-[0.12em] text-[var(--muted)]">{label}</div>
        <div className="text-[14.5px] truncate">{value}</div>
      </div>
    </div>
  );

  const ShoppingDetail = ({ item, onClose, onToggle, onDelete, onChange, currentUser }) => {
    if (!item) return null;
    return (
      <Sheet open={!!item} onClose={onClose} title="Eintrag">
        <div className="flex items-start gap-2 justify-between">
          <div className="flex-1 min-w-0">
            <div className="text-[24px] font-semibold leading-tight flex items-center gap-1.5">
              {item.spinnerei && <span className="text-[var(--terra)]">✦</span>}
              {item.text}
            </div>
            {item.qty && <div className="text-[13.5px] text-[var(--ink-soft)] mt-1">{item.qty}</div>}
          </div>
        </div>

        <div className="mt-4 space-y-2">
          <DetailRow label="Hinzugefügt von"
            value={<span className="inline-flex items-center gap-2"><Avatar id={item.by} size={20}/>{USERS[item.by].name}</span>}
            icon={<IconHeart size={16}/>}/>
          <DetailRow label="Wann" value={item.added} icon={<IconClock size={16}/>}/>
        </div>

        <div className="text-[11.5px] uppercase tracking-[0.12em] text-[var(--muted)] mt-4 mb-1.5">Liste</div>
        <div className="inline-flex p-0.5 rounded-full bg-[var(--cream-deep)]">
          <button onClick={() => onChange && onChange({ ...item, spinnerei: false, scope: "geteilt" })}
            className={`px-2.5 py-1 text-[12px] rounded-full tap font-medium inline-flex items-center gap-1 ${!item.spinnerei && item.scope==="geteilt" ? "bg-[var(--paper)] shadow-card" : "text-[var(--ink-soft)]"}`}>
            <IconUsers size={12}/> Gemeinsam
          </button>
          <button onClick={() => onChange && onChange({ ...item, spinnerei: false, scope: currentUser })}
            className={`px-2.5 py-1 text-[12px] rounded-full tap font-medium inline-flex items-center gap-1 ${!item.spinnerei && item.scope!=="geteilt" ? "bg-[var(--paper)] shadow-card" : "text-[var(--ink-soft)]"}`}>
            <IconLock size={12} strokeWidth={2}/> Privat
          </button>
          <button onClick={() => onChange && onChange({ ...item, spinnerei: true })}
            className={`px-2.5 py-1 text-[12px] rounded-full tap font-medium inline-flex items-center gap-1 ${item.spinnerei ? "bg-[var(--paper)] text-[var(--terra)] shadow-card" : "text-[var(--ink-soft)]"}`}>
            <span>✦</span> Spinnerei
          </button>
        </div>

        <div className="flex gap-2 mt-5">
          <button onClick={() => { onToggle(item.id); onClose(); }}
            className={`flex-1 py-3 rounded-2xl text-[15px] font-semibold tap ${item.done ? "bg-[var(--cream-deep)] text-[var(--ink)]" : "bg-[var(--sage)] text-white"}`}>
            {item.done ? "Wieder offen" : "Gekauft ✓"}
          </button>
          <button onClick={() => { onDelete(item.id); onClose(); }}
            className="px-4 rounded-2xl bg-[var(--cream-deep)] text-[var(--ink-soft)] tap">
            <IconX size={18}/>
          </button>
        </div>
      </Sheet>
    );
  };

  const TodoDetail = ({ todo, onClose, onChange, onDelete, currentUser }) => {
    if (!todo) return null;
    const p = PRIO[todo.prio] || PRIO.normal;
    return (
      <Sheet open={!!todo} onClose={onClose} title="Aufgabe">
        <div className="flex items-start justify-between gap-3">
          <div className="text-[22px] font-semibold leading-tight flex-1 flex items-start gap-2">
            {p.dot && <span className="inline-block w-2 h-2 rounded-full mt-2.5 shrink-0" style={{ background: p.color }}/>}
            <span>{todo.text}</span>
          </div>
          <Avatar id={todo.by} size={22}/>
        </div>
        {todo.note && (
          <div className="bg-[var(--cream-deep)]/60 rounded-2xl p-3 mt-3">
            <div className="uplabel text-[10px] text-[var(--muted)] mb-1">Notiz</div>
            <div className="text-[14px] whitespace-pre-line leading-relaxed">{todo.note}</div>
          </div>
        )}

        <div className="mt-4 space-y-2">
          <DetailRow label="Fällig"
            value={todo.due ? formatDate(todo.due) : "Ohne Datum"}
            icon={<IconCal size={16}/>}/>
          <DetailRow label="Hinzugefügt"
            value={`${USERS[todo.by].name} · ${todo.when}`}
            icon={<IconClock size={16}/>}/>
        </div>

        <div className="uplabel text-[10.5px] text-[var(--muted)] mt-4 mb-1.5">Priorität</div>
        <div className="inline-flex p-0.5 rounded-full bg-[var(--cream-deep)]">
          {Object.entries(PRIO).map(([k, v]) => (
            <button key={k} onClick={() => onChange({ ...todo, prio: k })}
              className={`px-3 py-1 text-[12px] rounded-full font-medium tap inline-flex items-center gap-1 ${todo.prio === k ? "bg-[var(--paper)] shadow-card" : "text-[var(--ink-soft)]"}`}
              style={todo.prio === k ? { color: v.color } : {}}>
              {v.dot && <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: v.color }}/>}
              {v.label}
            </button>
          ))}
        </div>

        <div className="flex items-center justify-between mt-3">
          <div className="uplabel text-[10.5px] text-[var(--muted)]">Sichtbar für</div>
          <ScopeToggle value={todo.scope || "geteilt"}
            onChange={(s) => onChange({ ...todo, scope: s })}
            currentUser={currentUser} compact/>
        </div>

        <div className="flex gap-2 mt-5">
          <button onClick={() => { onChange({ ...todo, done: !todo.done }); onClose(); }}
            className={`flex-1 py-3 rounded-2xl text-[15px] font-semibold tap ${todo.done ? "bg-[var(--cream-deep)] text-[var(--ink)]" : "bg-[var(--sage)] text-white"}`}>
            {todo.done ? "Wieder offen" : "Erledigt ✓"}
          </button>
          <button onClick={() => { onDelete(todo.id); onClose(); }}
            className="px-4 rounded-2xl bg-[var(--cream-deep)] text-[var(--ink-soft)] tap">
            <IconX size={18}/>
          </button>
        </div>
      </Sheet>
    );
  };

  const GoalDetail = ({ goal, onClose, onChange, onDelete, currentUser }) => {
    if (!goal) return null;
    const doneSteps = goal.steps.filter(s => s.done).length;
    const pct = Math.min(100, Math.round((goal.current / Math.max(goal.target, 1)) * 100));
    const [newStep, setNewStep] = useState("");

    const toggleStep = (id) =>
      onChange({ ...goal, steps: goal.steps.map(s => s.id === id ? { ...s, done: !s.done } : s) });
    const removeStep = (id) =>
      onChange({ ...goal, steps: goal.steps.filter(s => s.id !== id) });
    const addStep = () => {
      const text = newStep.trim();
      if (!text) return;
      onChange({ ...goal, steps: [...goal.steps, { id: uid(), text, done: false }] });
      setNewStep("");
    };
    const bumpCurrent = (delta) =>
      onChange({ ...goal, current: Math.max(0, Math.min(goal.target, goal.current + delta)) });

    return (
      <Sheet open={!!goal} onClose={onClose} title="Ziel">
        <div className="flex items-start justify-between gap-3">
          <div className="flex-1 min-w-0">
            <div className="uplabel text-[10px] text-[var(--muted)] flex items-center gap-1.5 mb-1">
              <IconFlag size={11} strokeWidth={2}/>
              {TERM_LABEL[goal.term]}
            </div>
            <div className="serif text-[24px] leading-tight">{goal.title}</div>
          </div>
          <AvatarWithScope by={goal.by} scope={goal.scope} size={24}/>
        </div>

        {/* Progress block */}
        <div className="mt-4 bg-[var(--cream-deep)]/60 rounded-2xl p-4">
          <div className="flex items-baseline justify-between mb-2">
            <div className="flex items-baseline gap-1.5">
              <span className="mono text-[28px] font-semibold leading-none">{goal.current}</span>
              <span className="text-[14px] text-[var(--muted)]">/ {goal.target}{goal.unit ? ` ${goal.unit}` : ""}</span>
            </div>
            <span className="mono text-[13px] text-[var(--ink-soft)]">{pct}%</span>
          </div>
          <GoalProgress goal={goal}/>
          <div className="flex gap-2 mt-3">
            <button onClick={() => bumpCurrent(-1)}
              className="flex-1 py-2 rounded-xl bg-[var(--paper)] text-[14px] font-medium tap text-[var(--ink-soft)]">
              −1
            </button>
            <button onClick={() => bumpCurrent(1)}
              className="flex-1 py-2 rounded-xl bg-[var(--paper)] text-[14px] font-medium tap text-[var(--ink-soft)]">
              +1
            </button>
            <button onClick={() => bumpCurrent(5)}
              className="flex-1 py-2 rounded-xl bg-[var(--paper)] text-[14px] font-medium tap text-[var(--ink-soft)]">
              +5
            </button>
          </div>
        </div>

        {/* Steps */}
        <div className="uplabel text-[10.5px] text-[var(--muted)] mt-4 mb-1.5 flex items-center justify-between">
          <span>Schritte</span>
          <span className="mono text-[10.5px] tracking-normal normal-case">{doneSteps} / {goal.steps.length}</span>
        </div>
        <div className="rounded-2xl bg-[var(--cream-deep)]/40 overflow-hidden">
          {goal.steps.length === 0 && (
            <div className="px-3.5 py-3 text-[13px] text-[var(--muted)]">Noch keine Schritte.</div>
          )}
          {goal.steps.map((s, i) => (
            <div key={s.id}

  const Field = ({ label, value, onChange, placeholder, type = "text" }) => (

      <div className="text-[11.5px] uppercase tracking-[0.12em] text-[var(--muted)] mb-1.5">{label}</div>
      <input type={type} value={value} onChange={e=>onChange(e.target.value)}
