name: ambardaellen

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ambardaellen}
      POSTGRES_USER: ${POSTGRES_USER:-ambardaellen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambardaellen} -d ${POSTGRES_DB:-ambardaellen}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DB ist nur intern erreichbar — kein Port-Mapping nach aussen.

  app:
    image: ${APP_IMAGE:-ghcr.io/daellengarnier/ambardaellen-app:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ambardaellen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ambardaellen}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Kein Port-Mapping — Caddy ist der einzige Eingang.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN muss in .env gesetzt sein}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
