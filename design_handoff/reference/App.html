  /* ============================================================
     CYCLE — tile, ring, calendar, sheet
     ============================================================ */
  const CycleBar = ({ cycle, analysis }) => {
    const len = cycle.avgCycle;
    const ovD = len - 14;
    const phases = [
      { from: 1, to: cycle.avgPeriod, color: PHASE_COLORS.menstruation },
      { from: cycle.avgPeriod, to: ovD - 3, color: PHASE_COLORS.follikel },
      { from: ovD - 3, to: ovD + 1, color: PHASE_COLORS.fertil },
      { from: ovD + 1, to: len, color: PHASE_COLORS.luteal },
    ];
    return (
      <div className="relative h-2 rounded-full overflow-hidden bg-[var(--cream-deep)]">
        {phases.map((p, i) => (
          <div key={i} className="absolute top-0 bottom-0"
            style={{
              left: `${((p.from-1)/len) * 100}%`,
              width: `${((p.to - (p.from-1))/len) * 100}%`,
              background: p.color, opacity: 0.6,
            }}/>
        ))}
        <div className="absolute top-[-2px] bottom-[-2px]"
          style={{
            left: `${((Math.min(analysis.day, len) - 0.5)/len) * 100}%`,
            width: 2.5,
            background: "var(--ink)",
            boxShadow: "0 0 0 2px var(--paper)",
            borderRadius: 2,
          }}/>
      </div>
    );
  };

  const CycleTile = ({ cycle, onOpen, canEdit }) => {
    const a = cycleAnalysis(cycle);
    if (!a) return null;
    return (
      <Card onClick={onOpen} className="p-3.5 relative overflow-hidden">
        <div className="flex items-start gap-3">
          <div className="shrink-0 flex flex-col items-center justify-center w-14 pt-1">
            <div className="text-[40px] leading-none font-semibold tracking-tight mono" style={{ color: a.color }}>
              {a.day}
            </div>
            <div className="uplabel text-[9px] text-[var(--muted)] mt-1">Tag</div>
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center justify-between gap-2 mb-1">
              <div className="uplabel text-[10px] text-[var(--muted)] flex items-center gap-1.5">
                Zyklus · Ambar {!canEdit && <IconLock size={9} strokeWidth={2}/>}
              </div>
            </div>
            <div className="text-[16px] font-semibold leading-tight" style={{ color: a.color }}>{a.phaseLabel}</div>
            <div className="mt-2"><CycleBar cycle={cycle} analysis={a}/></div>
            <div className="flex items-center justify-between mt-1.5 text-[11px] text-[var(--ink-soft)] gap-2">
              <span className="whitespace-nowrap">
                {a.daysUntilOvulation > 0
                  ? `Eisprung in ${a.daysUntilOvulation} T.`
                  : a.daysUntilOvulation === 0
                    ? "Eisprung heute"
                    : (a.daysUntilPeriod < 0 ? "" : `Eisprung vor ${-a.daysUntilOvulation} T.`)}
              </span>
              <span className="whitespace-nowrap">
                {a.daysUntilPeriod > 0
                  ? `Periode in ${a.daysUntilPeriod} T.`
                  : a.daysUntilPeriod === 0
                    ? "Periode heute"
                    : `${-a.daysUntilPeriod} T. überfällig`}
              </span>
            </div>
          </div>
        </div>
      </Card>
    );
  };

  /* Circular ring visualization */
  const CycleRing = ({ cycle, analysis }) => {
    const size = 200, cx = size/2, cy = size/2, r = 78, sw = 14;
    const len = cycle.avgCycle;
    const ovD = len - 14;

    const arcPath = (from, to) => {
      const f = Math.max(0, from - 1);
      const t = Math.min(len, to);
      if (t <= f) return "";
      const a0 = (f/len) * Math.PI * 2 - Math.PI/2;
      const a1 = (t/len) * Math.PI * 2 - Math.PI/2;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    };
    const phases = [
      { from: 1,                   to: cycle.avgPeriod,    color: PHASE_COLORS.menstruation, label: "Periode" },
      { from: cycle.avgPeriod + 1, to: ovD - 3 - 1,        color: PHASE_COLORS.follikel,     label: "Follikel" },
      { from: ovD - 3,             to: ovD + 1,            color: PHASE_COLORS.fertil,       label: "Fruchtbar" },
      { from: ovD + 2,             to: len,                color: PHASE_COLORS.luteal,       label: "Luteal" },
    ];

    // today marker position
    const dayClamped = ((analysis.day - 0.5) % len + len) % len;
    const at = (dayClamped/len) * Math.PI * 2 - Math.PI/2;
    const mx = cx + r * Math.cos(at);
    const my = cy + r * Math.sin(at);

    // ovulation marker
    const ot = ((ovD - 0.5)/len) * Math.PI * 2 - Math.PI/2;
    const ox = cx + r * Math.cos(ot);
    const oy = cy + r * Math.sin(ot);

    return (
      <div className="flex items-center justify-center">
        <svg width={size} height={size}>
          {/* Background ring */}
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--cream-deep)" strokeWidth={sw}/>
          {/* Phase arcs */}
          {phases.map((p, i) => (
            <path key={i} d={arcPath(p.from, p.to)} fill="none"
              stroke={p.color} strokeWidth={sw} opacity="0.85"/>
          ))}
          {/* Ovulation dot */}
          <circle cx={ox} cy={oy} r={3.5} fill={PHASE_COLORS.fertil} stroke="var(--paper)" strokeWidth="1.5"/>
          {/* Today marker */}
          <circle cx={mx} cy={my} r={10} fill="var(--paper)" stroke={analysis.color} strokeWidth="3"/>
          {/* Center text */}
          <text x={cx} y={cy-2} textAnchor="middle" fill="#211913" fontSize="56" fontWeight="400" fontStyle="italic" fontFamily="'Instrument Serif', Georgia, serif">{analysis.day}</text>
          <text x={cx} y={cy+22} textAnchor="middle" fill="#978675" fontSize="9.5" letterSpacing="3" fontWeight="600">TAG · {len}</text>
        </svg>
      </div>
    );
  };

  /* Month calendar with phase coloring */
  const CycleCalendar = ({ cycle, onTapDay }) => {
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const startWeekday = (first.getDay() + 6) % 7; // Mon-first
    const daysInMonth = last.getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);

    const lastPeriodStart = cycle.periodStarts[cycle.periodStarts.length - 1];
    const lastPSDate = new Date(lastPeriodStart + "T00:00:00");

    const cellInfo = (d) => {
      const iso = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const tDate = new Date(iso + "T00:00:00");
      // find closest past period start
      let baseStart = null;
      let diff = Infinity;
      cycle.periodStarts.forEach(ps => {
        const psDate = new Date(ps + "T00:00:00");
        const dd = Math.floor((tDate - psDate) / 86400000);
        if (dd >= 0 && dd < diff) { diff = dd; baseStart = psDate; }
      });
      let dayInCycle;
      if (baseStart) {
        dayInCycle = Math.floor((tDate - baseStart) / 86400000) + 1;
        // If beyond cycle length, project forward
        if (dayInCycle > cycle.avgCycle) {
          dayInCycle = ((dayInCycle - 1) % cycle.avgCycle) + 1;
        }
      } else {
        // future from last period: project
        const dd = Math.floor((tDate - lastPSDate) / 86400000);
        dayInCycle = ((dd % cycle.avgCycle) + cycle.avgCycle) % cycle.avgCycle + 1;
      }
      const phase = phaseForDay(cycle, dayInCycle);
      return {
        iso, dayInCycle, phase,
        isToday: iso === todayISO,
        isPeriodStart: cycle.periodStarts.includes(iso),
        entry: cycle.entries[iso],
      };
    };

    return (
      <div>
        <div className="text-[12px] font-semibold text-[var(--ink-soft)] mb-1.5 flex items-center justify-between">
          <span>{first.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</span>
          <span className="text-[10px] font-normal text-[var(--muted)] uppercase tracking-wider">Prognose</span>
        </div>
        <div className="grid grid-cols-7 gap-1 text-center text-[10px] text-[var(--muted)] mb-1">
          {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d => <div key={d}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i}/>;
            const info = cellInfo(d);
            const phaseCol = PHASE_COLORS[info.phase];
            const isOvulation = info.dayInCycle === cycle.avgCycle - 14;
            return (
              <button key={i} onClick={() => onTapDay && onTapDay(info.iso)}
                className="aspect-square rounded-lg flex items-center justify-center text-[12px] font-medium relative tap"
                style={{
                  background: info.isToday
                    ? phaseCol
                    : `${phaseCol}22`,
                  color: info.isToday ? "white" : "var(--ink)",
                  boxShadow: info.isToday ? `0 0 0 1.5px var(--paper) inset, 0 0 0 2px ${phaseCol}` : "none",
                }}>
                <span className="relative z-10">{d}</span>
                {info.isPeriodStart && !info.isToday && (
                  <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full" style={{ background: PHASE_COLORS.menstruation }}/>
                )}
                {isOvulation && !info.isToday && (
                  <span className="absolute bottom-0.5 w-1 h-1 rounded-full" style={{ background: PHASE_COLORS.fertil }}/>
                )}
                {info.entry && !info.isPeriodStart && !info.isToday && (
                  <span className="absolute bottom-0.5 left-0.5 w-1 h-1 rounded-full" style={{ background: "var(--ink-soft)" }}/>
                )}
              </button>
            );
          })}
        </div>
      </div>
    );
  };

  const PhaseHint = ({ phase }) => {
    const HINTS = {
      menstruation: "Ruhe, Wärme, weniger Reize. Wenig Plan, viel Spielraum.",
      follikel:     "Energie steigt. Gut für neue Projekte und längere Spaziergänge.",
      fertil:       "Sozial, kreativ, klar im Kopf. Termine ruhig vollpacken.",
      luteal:       "Innere Phase. Routinen helfen. Auf Schlaf achten.",
      ueberfaellig: "Periode ist überfällig. Wenn unsicher, Termin checken.",
    };
    return (
      <div className="text-[12.5px] text-[var(--ink-soft)] leading-relaxed">{HINTS[phase] || ""}</div>
    );
  };

  const CycleSheet = ({ open, cycle, setCycle, onClose, currentUser }) => {
    if (!open) return null;
    const a = cycleAnalysis(cycle);
    const canEdit = currentUser === cycle.owner;
    const todayEntry = cycle.entries[todayISO] || {};

    const updateEntry = (patch) => {
      if (!canEdit) return;
      const newEntries = { ...cycle.entries, [todayISO]: { ...todayEntry, ...patch } };
      setCycle({ ...cycle, entries: newEntries });
    };
    const toggleSymptom = (s) => {
      if (!canEdit) return;
      const cur = todayEntry.symptoms || [];
      const next = cur.includes(s) ? cur.filter(x => x !== s) : [...cur, s];
      updateEntry({ symptoms: next });
    };
    const markPeriodToday = () => {
      if (!canEdit) return;
      if (cycle.periodStarts.includes(todayISO)) return;
      setCycle({
        ...cycle,
        periodStarts: [...cycle.periodStarts, todayISO].sort(),
        entries: { ...cycle.entries, [todayISO]: { ...todayEntry, flow: todayEntry.flow || 2 } },
      });
    };
    const setAvgCycle = (n) => canEdit && setCycle({ ...cycle, avgCycle: Math.max(20, Math.min(45, n)) });
    const setAvgPeriod = (n) => canEdit && setCycle({ ...cycle, avgPeriod: Math.max(2, Math.min(10, n)) });

    return (
      <Sheet open={open} onClose={onClose} title={`Zyklus · ${USERS[cycle.owner].name}`}>
        {!canEdit && (
          <div className="bg-[var(--cream-deep)]/80 rounded-2xl p-2.5 mb-3 text-[12.5px] text-[var(--ink-soft)] inline-flex items-center gap-2">
            <IconLock size={13} strokeWidth={2}/> Nur Ambar kann bearbeiten — du siehst Phase und Stimmung
          </div>
        )}

        <CycleRing cycle={cycle} analysis={a}/>

        <div className="text-center mt-1 mb-2">
          <div className="serif-i text-[26px] leading-tight" style={{ color: a.color }}>{a.phaseLabel}</div>
          <div className="text-[12.5px] text-[var(--ink-soft)] mt-0.5">
            {a.daysUntilOvulation > 0 ? `Eisprung in ${a.daysUntilOvulation} T.` : a.daysUntilOvulation === 0 ? "Eisprung heute" : `${-a.daysUntilOvulation} T. nach Eisprung`}
            {" · "}
            {a.daysUntilPeriod > 0 ? `Periode in ${a.daysUntilPeriod} T.` : a.daysUntilPeriod === 0 ? "Periode heute" : `${-a.daysUntilPeriod} T. überfällig`}
          </div>
        </div>

        <div className="bg-[var(--cream-deep)]/60 rounded-2xl p-3 mt-1">
          <PhaseHint phase={a.phase}/>
        </div>

        {canEdit && (
          <button onClick={markPeriodToday}
            disabled={cycle.periodStarts.includes(todayISO)}
            className={`w-full mt-3 py-2.5 rounded-2xl text-[13.5px] font-semibold tap ${
              cycle.periodStarts.includes(todayISO)
                ? "bg-[var(--cream-deep)] text-[var(--muted)]"
                : "bg-[#A8484E] text-white"
            }`}>
            {cycle.periodStarts.includes(todayISO) ? "Periode heute eingetragen ✓" : "Periode hat heute begonnen"}
          </button>
        )}

        {/* Today log */}
        {canEdit && (
          <div className="mt-3 bg-[var(--cream-deep)]/60 rounded-2xl p-3">
            <div className="text-[11.5px] uppercase tracking-[0.14em] text-[var(--muted)] mb-2">Heute eintragen</div>

            <div className="mb-3">
              <div className="text-[11px] text-[var(--ink-soft)] mb-1.5">Blutung</div>
              <div className="flex gap-1">
                {FLOW.map(f => (
                  <button key={f.v} onClick={() => updateEntry({ flow: f.v })}
                    className={`flex-1 py-1.5 rounded-xl text-[12px] font-medium tap ${todayEntry.flow === f.v ? "text-white" : "bg-[var(--paper)] text-[var(--ink-soft)]"}`}
                    style={todayEntry.flow === f.v ? { background: PHASE_COLORS.menstruation } : {}}>
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-3">
              <div className="text-[11px] text-[var(--ink-soft)] mb-1.5">Stimmung</div>
              <div className="flex gap-1 flex-wrap">
                {MOODS.map(m => (
                  <button key={m.id} onClick={() => updateEntry({ mood: m.id })}
                    className={`px-2.5 py-1 rounded-full text-[11.5px] font-medium tap inline-flex items-center gap-1 ${todayEntry.mood === m.id ? "bg-[var(--ink)] text-[var(--paper)]" : "bg-[var(--paper)] text-[var(--ink-soft)]"}`}>
                    <span>{m.emoji}</span> {m.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-3">
              <div className="text-[11px] text-[var(--ink-soft)] mb-1.5">Energie</div>
              <div className="flex gap-1">
                {[1,2,3,4,5].map(n => (
                  <button key={n} onClick={() => updateEntry({ energy: n })}
                    className={`flex-1 py-1.5 rounded-xl text-[12px] font-medium tap ${(todayEntry.energy||0) >= n ? "bg-[var(--sage)] text-white" : "bg-[var(--paper)] text-[var(--ink-soft)]"}`}>
                    {n}
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-2">
              <div className="text-[11px] text-[var(--ink-soft)] mb-1.5">Symptome</div>
              <div className="flex gap-1 flex-wrap">
                {SYMPTOMS.map(s => {
                  const on = (todayEntry.symptoms || []).includes(s);
                  return (
                    <button key={s} onClick={() => toggleSymptom(s)}
                      className={`px-2.5 py-1 rounded-full text-[11.5px] font-medium tap ${on ? "bg-[var(--terra)] text-white" : "bg-[var(--paper)] text-[var(--ink-soft)]"}`}>
                      {s}
                    </button>
                  );
                })}
              </div>
            </div>

            <div>
              <div className="text-[11px] text-[var(--ink-soft)] mb-1.5">Notiz</div>
              <textarea value={todayEntry.note || ""}
                onChange={e => updateEntry({ note: e.target.value })}
                rows={2}
                placeholder="Wie geht's dir heute?"
                className="w-full bg-[var(--paper)] rounded-xl p-2.5 text-[13px] placeholder:text-[var(--muted)] resize-none"/>
            </div>
          </div>
        )}

        {/* Calendar */}
        <div className="mt-4">
          <CycleCalendar cycle={cycle}/>
        </div>

        {/* Stats */}
        <div className="mt-4 grid grid-cols-2 gap-2">
          <Card className="p-2.5">
            <div className="text-[10px] uppercase tracking-[0.14em] text-[var(--muted)]">Ø Zyklus</div>
            <div className="flex items-center gap-2 mt-0.5">
              {canEdit && <button onClick={() => setAvgCycle(cycle.avgCycle - 1)} className="w-6 h-6 rounded-full bg-[var(--cream-deep)] text-[var(--ink-soft)] tap text-[14px]">−</button>}
              <div className="text-[15px] font-semibold">{cycle.avgCycle} T.</div>
              {canEdit && <button onClick={() => setAvgCycle(cycle.avgCycle + 1)} className="w-6 h-6 rounded-full bg-[var(--cream-deep)] text-[var(--ink-soft)] tap text-[14px]">+</button>}
            </div>
          </Card>
          <Card className="p-2.5">
            <div className="text-[10px] uppercase tracking-[0.14em] text-[var(--muted)]">Ø Periode</div>
            <div className="flex items-center gap-2 mt-0.5">
              {canEdit && <button onClick={() => setAvgPeriod(cycle.avgPeriod - 1)} className="w-6 h-6 rounded-full bg-[var(--cream-deep)] text-[var(--ink-soft)] tap text-[14px]">−</button>}
              <div className="text-[15px] font-semibold">{cycle.avgPeriod} T.</div>
              {canEdit && <button onClick={() => setAvgPeriod(cycle.avgPeriod + 1)} className="w-6 h-6 rounded-full bg-[var(--cream-deep)] text-[var(--ink-soft)] tap text-[14px]">+</button>}
            </div>
          </Card>
          <Card className="p-2.5">
            <div className="text-[10px] uppercase tracking-[0.14em] text-[var(--muted)]">Nächste Periode</div>
            <div className="text-[14px] font-medium mt-0.5">{shortDate(a.nextPeriod)}</div>
          </Card>
          <Card className="p-2.5">
            <div className="text-[10px] uppercase tracking-[0.14em] text-[var(--muted)]">Eisprung</div>
            <div className="text-[14px] font-medium mt-0.5">{shortDate(a.ovulationDate)}</div>
          </Card>
        </div>

        <div className="text-[11px] text-[var(--muted)] mt-3 text-center">
          Vorhersage basiert auf {cycle.periodStarts.length} aufgezeichneten Zyklen.
        </div>
      </Sheet>
    );
  };

  /* ============================================================
     USER SWITCHER (small, top-right of phone outside-ish)
     ============================================================ */
  const UserSwitcher = ({ user, setUser }) => (
    <div className="absolute top-[12px] right-7 z-50 flex items-center gap-1 bg-[var(--paper)]/90 backdrop-blur rounded-full p-0.5 shadow-card"
      style={{ display: "none" }} /* hidden — switcher lives elsewhere */>
    </div>
  );

  /* ============================================================
     ROOT APP
     ============================================================ */
  function App() {
    const [tab, setTab] = useState("heute");
    const [currentUser, setCurrentUser] = useState("D"); // who is using the phone right now

    const [activities, setActivities] = useState(SEED_ACTIVITIES);
    const [shopping,   setShopping]   = useState(SEED_SHOPPING);
    const [todos,      setTodos]      = useState(SEED_TODOS);
    const [goals,      setGoals]      = useState(SEED_GOALS);
    const [cycle,      setCycle]      = useState(SEED_CYCLE);

    const [openAct,  setOpenAct]  = useState(null);
    const [openShop, setOpenShop] = useState(null);
    const [openTodo, setOpenTodo] = useState(null);
    const [openGoal, setOpenGoal] = useState(null);
    const [cycleOpen, setCycleOpen] = useState(false);
    const [addActOpen,  setAddActOpen]  = useState(false);
    const [addTodoOpen, setAddTodoOpen] = useState(false);
    const [addGoalOpen, setAddGoalOpen] = useState(false);

    const updateActivity = (a) => setActivities(activities.map(x => x.id===a.id?a:x));
    const deleteActivity = (id) => setActivities(activities.filter(x => x.id!==id));

    const toggleShopping = (id) => setShopping(shopping.map(s => s.id===id ? {...s, done: !s.done} : s));
    const updateShopping = (item) => setShopping(shopping.map(s => s.id===item.id ? item : s));
    const deleteShopping = (id) => setShopping(shopping.filter(s => s.id!==id));
    const quickAddShopping = (text) => {
      if (!text.trim()) return;
      setShopping([{
        id: uid(), text: text.trim(), spinnerei: false,
        done: false, by: currentUser, scope: "geteilt", qty: "", added: "gerade eben",
      }, ...shopping]);
    };

    const toggleTodo = (id) => setTodos(todos.map(t => t.id===id ? {...t, done: !t.done} : t));
    const updateTodo = (t) => setTodos(todos.map(x => x.id===t.id?t:x));
    const deleteTodo = (id) => setTodos(todos.filter(x => x.id!==id));

    const updateGoal = (g) => setGoals(goals.map(x => x.id===g.id?g:x));
    const deleteGoal = (id) => setGoals(goals.filter(x => x.id!==id));

    return (
      <div className="relative">
        <div className="phone relative">
          <div className="screen">
            <Atmosphere/>
            <div className="notch"/>
            <StatusBar/>



            {tab === "heute" && (
              <HeuteScreen currentUser={currentUser}
                activities={activities} shopping={shopping} todos={todos} goals={goals}
                cycle={cycle} onOpenCycle={() => setCycleOpen(true)}
                toggleShopping={toggleShopping} quickAddShopping={quickAddShopping}
                toggleTodo={toggleTodo}
                openActivity={setOpenAct} openShopping={setOpenShop}
                openTodo={setOpenTodo} openGoal={setOpenGoal}
                goTab={setTab}/>
            )}
            {tab === "akt" && (
              <AktScreen currentUser={currentUser}
                activities={activities} openActivity={setOpenAct}
                addActivity={() => setAddActOpen(true)}/>
            )}
            {tab === "shop" && (
              <ShopScreen shopping={shopping} setShopping={setShopping}
                openShopping={setOpenShop} currentUser={currentUser}/>
            )}
            {tab === "todo" && (
              <TodoScreen currentUser={currentUser}
                todos={todos} openTodo={setOpenTodo}
                toggleTodo={toggleTodo}
                addTodo={() => setAddTodoOpen(true)}/>
            )}
            {tab === "ziel" && (
              <GoalScreen currentUser={currentUser}
                goals={goals} openGoal={setOpenGoal}
                addGoal={() => setAddGoalOpen(true)}/>
            )}

            <TabBar tab={tab} setTab={setTab}/>

            {/* Sheets */}
            <ActivityDetail activity={openAct} onClose={()=>setOpenAct(null)}
              onChange={updateActivity} onDelete={deleteActivity} currentUser={currentUser}/>
            <ShoppingDetail item={openShop} onClose={()=>setOpenShop(null)}
              onToggle={toggleShopping} onChange={updateShopping} onDelete={deleteShopping} currentUser={currentUser}/>
            <TodoDetail todo={openTodo} onClose={()=>setOpenTodo(null)}
              onChange={updateTodo} onDelete={deleteTodo} currentUser={currentUser}/>
            <GoalDetail goal={openGoal} onClose={()=>setOpenGoal(null)}
              onChange={updateGoal} onDelete={deleteGoal} currentUser={currentUser}/>

            <CycleSheet open={cycleOpen} cycle={cycle} setCycle={setCycle}
              onClose={()=>setCycleOpen(false)} currentUser={currentUser}/>

            <ActivityAddSheet open={addActOpen} onClose={()=>setAddActOpen(false)}
              onAdd={(a)=>setActivities([a, ...activities])} currentUser={currentUser}/>
            <TodoAddSheet open={addTodoOpen} onClose={()=>setAddTodoOpen(false)}
              onAdd={(t)=>setTodos([t, ...todos])} currentUser={currentUser}/>
            <GoalAddSheet open={addGoalOpen} onClose={()=>setAddGoalOpen(false)}
              onAdd={(g)=>setGoals([g, ...goals])} currentUser={currentUser}/>
          </div>
        </div>

        {/* Prototype-only user switcher — sits outside the phone */}
        <div className="mt-6 flex flex-col items-center gap-2">
          <div className="uplabel text-[10px] text-[#4F4338]/55">Du bist gerade</div>
          <div className="inline-flex p-1 rounded-full shadow-card" style={{ background: "#FBF6E8" }}>
            {["A","D"].map(uid => {
              const u = USERS[uid];
              const active = currentUser === uid;
              return (
                <button key={uid}
                  onClick={() => setCurrentUser(uid)}
                  className="tap inline-flex items-center gap-2 pl-1 pr-3.5 py-1 rounded-full"
                  style={{
                    background: active ? u.soft : "transparent",
                    color: active ? u.color : "#4F4338",
                  }}>
                  <Avatar id={uid} size={22}/>
                  <span className="text-[13px] font-semibold">{u.name}</span>
                </button>
              );
            })}
          </div>
          <div className="text-center text-[11.5px] text-[#4F4338]/55 max-w-[320px] mt-1 serif-i">
            Neue Einträge werden dem aktiven Nutzer zugeschrieben
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
